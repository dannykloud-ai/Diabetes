name: Build Android App Clean

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create Project Structure and Files
      run: |
        mkdir -p app/src/main/java/com/example/glykemiamapapp
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
            repositories {
                google()
                mavenCentral()
                maven { url 'https://jitpack.io' }
            }
        }
        rootProject.name = "GlycemiaMapApp"
        include ':app'
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.example.glykemiamapapp'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.glykemiamapapp"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
            buildFeatures {
                viewBinding true
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'org.osmdroid:osmdroid-android:6.1.18'
            implementation 'com.google.android.gms:play-services-location:21.1.0'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
            implementation 'org.json:json:20231013'
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.example.glykemiamapapp">

            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

            <application
                android:allowBackup="true"
                android:label="Glycemia Map"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical">

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:background="#222222"
                android:orientation="vertical"
                android:padding="16dp">

                <TextView
                    android:id="@+id/tvGlycemia"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Dexcom: Prihlasujem..."
                    android:textColor="#FFFFFF"
                    android:textSize="18sp"
                    android:textStyle="bold" />

                <TextView
                    android:id="@+id/tvStatus"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:layout_marginTop="4dp"
                    android:text="GPS: Hľadám polohu..."
                    android:textColor="#AAAAAA"
                    android:textSize="13sp" />
            </LinearLayout>

            <org.osmdroid.views.MapView
                android:id="@+id/mapView"
                android:layout_width="match_parent"
                android:layout_height="match_parent" />

        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/example/glykemiamapapp/MainActivity.kt
        package com.example.glykemiamapapp

        import android.Manifest
        import android.content.Context
        import android.content.pm.PackageManager
        import android.location.Location
        import android.os.Bundle
        import android.widget.EditText
        import androidx.appcompat.app.AlertDialog
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.app.ActivityCompat
        import androidx.core.content.ContextCompat
        import com.example.glykemiamapapp.databinding.ActivityMainBinding
        import com.google.android.gms.location.FusedLocationProviderClient
        import com.google.android.gms.location.LocationServices
        import kotlinx.coroutines.*
        import okhttp3.MediaType.Companion.toMediaType
        import okhttp3.OkHttpClient
        import okhttp3.Request
        import okhttp3.RequestBody.Companion.toRequestBody
        import org.json.JSONArray
        import org.json.JSONObject
        import org.osmdroid.config.Configuration
        import org.osmdroid.tileprovider.tilesource.TileSourceFactory
        import org.osmdroid.util.GeoPoint
        import org.osmdroid.views.overlay.Marker
        import java.util.concurrent.TimeUnit

        class MainActivity : AppCompatActivity() {

            private lateinit var binding: ActivityMainBinding
            private lateinit var fusedLocationClient: FusedLocationProviderClient
            private var currentMarker: Marker? = null
            private val coroutineScope = CoroutineScope(Dispatchers.Main + Job())
            private val client = OkHttpClient.Builder().connectTimeout(10, TimeUnit.SECONDS).build()

            companion object {
                private const val PERMISSION_REQUEST_CODE = 1001
                private const val DEXCOM_APP_ID = "d894b4e4-d374-42ea-9c02-e251147e436d"
                private const val DEXCOM_BASE_URL = "https://shareous1.dexcom.com/ShareWebServices/Services"
            }

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                Configuration.getInstance().load(applicationContext, getSharedPreferences("osmdroid", MODE_PRIVATE))
                
                binding = ActivityMainBinding.inflate(layoutInflater)
                setContentView(binding.root)

                fusedLocationClient = LocationServices.getFusedLocationProviderClient(this)

                binding.mapView.setTileSource(TileSourceFactory.MAPNIK)
                binding.mapView.setMultiTouchControls(true)
                binding.mapView.controller.setZoom(15.0)
                binding.mapView.controller.setCenter(GeoPoint(49.0522, 20.3025))

                checkPermissions()
                loadCredentialsAndStart()
            }

            private fun checkPermissions() {
                val permissions = arrayOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION)
                if (permissions.any { ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }) {
                    ActivityCompat.requestPermissions(this, permissions, PERMISSION_REQUEST_CODE)
                } else {
                    startLocationUpdates()
                }
            }

            private fun startLocationUpdates() {
                try {
                    fusedLocationClient.lastLocation.addOnSuccessListener { location: Location? ->
                        location?.let {
                            val pt = GeoPoint(it.latitude, it.longitude)
                            binding.mapView.controller.setCenter(pt)
                            if (currentMarker == null) {
                                currentMarker = Marker(binding.mapView).apply {
                                    position = pt
                                    setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM)
                                    title = "Ja tu"
                                }
                                binding.mapView.overlays.add(currentMarker)
                            } else {
                                currentMarker?.position = pt
                            }
                            binding.mapView.invalidate()
                            binding.tvStatus.text = "GPS: ${it.latitude}, ${it.longitude}"
                        }
                    }
                } catch (e: SecurityException) {
                    binding.tvStatus.text = "GPS chyba"
                }
            }

            private fun loadCredentialsAndStart() {
                val prefs = getSharedPreferences("DexPrefs", Context.MODE_PRIVATE)
                val user = prefs.getString("user", "") ?: ""
                val pass = prefs.getString("pass", "") ?: ""

                if (user.isEmpty() || pass.isEmpty()) {
                    val layout = android.widget.LinearLayout(this).apply {
                        orientation = android.widget.LinearLayout.VERTICAL
                        setPadding(40, 30, 40, 10)
                    }
                    val inputU = EditText(this).apply { hint = "Dexcom Email" }
                    val inputP = EditText(this).apply { 
                        hint = "Dexcom Heslo"
                        inputType = android.text.InputType.TYPE_CLASS_TEXT or android.text.InputType.TYPE_TEXT_VARIATION_PASSWORD
                    }
                    layout.addView(inputU)
                    layout.addView(inputP)

                    AlertDialog.Builder(this)
                        .setTitle("Prihlásenie Dexcom")
                        .setView(layout)
                        .setCancelable(false)
                        .setPositiveButton("Uložiť") { _, _ ->
                            val u = inputU.text.toString().trim()
                            val p = inputP.text.toString().trim()
                            prefs.edit().putString("user", u).putString("pass", p).apply()
                            startDexcomLoop(u, p)
                        }.show()
                } else {
                    startDexcomLoop(user, pass)
                }
            }

            private fun startDexcomLoop(user: String, pass: String) {
                coroutineScope.launch(Dispatchers.IO) {
                    while (isActive) {
                        try {
                            val loginUrl = "$DEXCOM_BASE_URL/General/LoginPublisherAccountByName"
                            val payload = JSONObject().put("accountName", user).put("password", pass).put("applicationId", DEXCOM_APP_ID)
                            val req = Request.Builder().url(loginUrl).post(payload.toString().toRequestBody("application/json".toMediaType())).build()
                            
                            client.newCall(req).execute().use { resp ->
                                if (resp.isSuccessful) {
                                    val sessionId = resp.body?.string()?.replace("\"", "")
                                    if (!sessionId.isNullOrEmpty() && sessionId != "00000000-0000-0000-0000-000000000000") {
                                        val dataUrl = "$DEXCOM_BASE_URL/Publisher/ReadPublisherLatestGlucoseValues?sessionId=$sessionId&minutes=1440&maxCount=1"
                                        val dataReq = Request.Builder().url(dataUrl).get().build()
                                        client.newCall(dataReq).execute().use { dataResp ->
                                            if (dataResp.isSuccessful) {
                                                val arr = JSONArray(dataResp.body?.string() ?: "[]")
                                                if (arr.length() > 0) {
                                                    val obj = arr.getJSONObject(0)
                                                    val mmol = obj.getDouble("Value") / 18.0
                                                    val formatted = String.format("%.1f", mmol)
                                                    withContext(Dispatchers.Main) {
                                                        binding.tvGlycemia.text = "Glykémia: $formatted mmol/L"
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        } catch (e: Exception) {
                            withContext(Dispatchers.Main) {
                                binding.tvGlycemia.text = "Dexcom: Chyba pripojenia"
                            }
                        }
                        delay(60000)
                    }
                }
            }

            override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                if (requestCode == PERMISSION_REQUEST_CODE) startLocationUpdates()
            }

            override fun onDestroy() {
                super.onDestroy()
                coroutineScope.cancel()
            }
        }
        EOF

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5 --distribution-type bin

    - name: Run Gradle Build
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
