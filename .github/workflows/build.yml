name: stavat

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Priprava adresarov
        run: |
          mkdir -p app/src/main/java
          find . -maxdepth 1 -name "*.kt" -exec mv {} app/src/main/java/ \;

      - name: Vytvorenie settings.gradle
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include ':app'
          EOF

      - name: Vytvorenie root build.gradle
        run: |
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.0' apply false
          }
          EOF

      - name: Vytvorenie app build.gradle
        run: |
          mkdir -p app
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.cukrovka'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.example.cukrovka'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

      - name: Priprava Manifest adresara
        run: |
          mkdir -p app/src/main

      - name: Vytvorenie AndroidManifest.xml
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Cukrovka">
                  <activity android:name=".MainActivitz" android:exported="true">
                      <intent-filter>
                          <action android:name="intent.action.MAIN" />
                          <category android:name="intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Vygenerovanie Gradle Wrapperu
        run: gradle wrapper

      - name: Spustenie Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
