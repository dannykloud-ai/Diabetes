 name: Zostavenie Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Priprava struktury a zostavenie
        run: |
          mkdir -p app/src/main/java
          find . -maxdepth 1 -name "*.kt" -exec mv {} app/src/main/java/ \; 2>/dev/null || true
          
          if [ ! -f "app/build.gradle" ]; then
            mkdir -p app
            echo "plugins { id 'com.android.application' }" > app/build.gradle
          fi
          
          echo "Projekt pripravený."
