 name: Build Android App Complete

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create Project Structure and Files
      run: |
        mkdir -p app/src/main/java/com/example/glykemiamapapp
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
            repositories {
                google()
                mavenCentral()
                maven { url 'https://jitpack.io' }
            }
        }
        rootProject.name = "GlycemiaMapApp"
        include ':app'
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.example.glykemiamapapp'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.glykemiamapapp"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
            buildFeatures {
                viewBinding true
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'org.osmdroid:osmdroid-android:6.1.18'
            implementation 'com.google.android.gms:play-services-location:21.1.0'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
            implementation 'org.json:json:20231013'
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.example.glykemiamapapp">

            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.BLUETOOTH" />
            <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
            <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

            <application
                android:allowBackup="true"
                android:label="Glycemia Map"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical">

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:background="#222222"
                android:orientation="vertical"
                android:padding="16dp">

                <TextView
                    android:id="@+id/tvGlycemia"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Dexcom: Inicializujem..."
                    android:textColor="#FFFFFF"
                    android:textSize="20sp"
                    android:textStyle="bold" />

                <TextView
                    android:id="@+id/tvStatus"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:layout_marginTop="6dp"
                    android:text="GPS: Hľadám polohu..."
                    android:textColor="#AAAAAA"
                    android:textSize="14sp" />
            </LinearLayout>

            <org.osmdroid.views.MapView
                android:id="@+id/mapView"
                android:layout_width="match_parent"
                android:layout_height="match_parent" />

        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/example/glykemiamapapp/MainActivity.kt
        package com.example.glykemiamapapp

        import android.Manifest
        import android.content.Context
        import android.content.pm.PackageManager
        import android.location.Location
        import android.os.Bundle
        import android.os.VibrationEffect
        import android.os.Vibrator
        import android.widget.EditText
        import android.widget.Toast
        import androidx.appcompat.app.AlertDialog
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.app.ActivityCompat
        import androidx.core.content.ContextCompat
        import com.example.glykemiamapapp.databinding.ActivityMainBinding
        import com.google.android.gms.location.FusedLocationProviderClient
        import com.google.android.gms.location.LocationServices
        import kotlinx.coroutines.*
        import okhttp3.MediaType.Companion.toMediaType
        import okhttp3.OkHttpClient
        import okhttp3.Request
        import okhttp3.RequestBody.Companion.toRequestBody
        import org.json.JSONArray
        import org.json.JSONObject
        import org.osmdroid.config.Configuration
        import org.osmdroid.tileprovider.tilesource.TileSourceFactory
        import org.osmdroid.util.GeoPoint
        import org.osmdroid.views.overlay.Marker
        import java.util.concurrent.TimeUnit

        class MainActivity : AppCompatActivity() {

            private lateinit var binding: ActivityMainBinding
            private lateinit var fusedLocationClient: FusedLocationProviderClient
            private var currentMarker: Marker? = null
            private val coroutineScope = CoroutineScope(Dispatchers.Main + Job())
            
            private val client = OkHttpClient.Builder()
                .connectTimeout(15, TimeUnit.SECONDS)
                .readTimeout(15, TimeUnit.SECONDS)
                .build()

            companion object {
                private const val PERMISSION_REQUEST_CODE = 1001
                private const val DEXCOM_APP_ID = "d894b4e4-d374-42ea-9c02-e251147e436d"
                private const val DEXCOM_BASE_URL = "https://shareous1.dexcom.com/ShareWebServices/Services"
            }

            private var dexcomUser = ""
            private var dexcomPass = ""

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                
                Configuration.getInstance().load(applicationContext, getSharedPreferences("osmdroid", MODE_PRIVATE))
                
                binding = ActivityMainBinding.inflate(layoutInflater)
                setContentView(binding.root)

                fusedLocationClient = LocationServices.getFusedLocationProviderClient(this)

                setupMap()
                checkPermissionsAndStart()
                loadOrPromptDexcomCredentials()
            }

            private fun setupMap() {
                binding.mapView.setTileSource(TileSourceFactory.MAPNIK)
                binding.mapView.setMultiTouchControls(true)
                val mapController = binding.mapView.controller
                mapController.setZoom(15.0)
                mapController.setCenter(GeoPoint(49.0522, 20.3025))
            }

            private fun checkPermissionsAndStart() {
                val permissions = arrayOf(
                    Manifest.permission.ACCESS_FINE_LOCATION,
                    Manifest.permission.ACCESS_COARSE_LOCATION
                )
                val missing = permissions.filter {
                    ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                }
                if (missing.isNotEmpty()) {
                    ActivityCompat.requestPermissions(this, missing.toTypedArray(), PERMISSION_REQUEST_CODE)
                } else {
                    fetchLocation()
                }
            }

            private fun fetchLocation() {
                try {
                    fusedLocationClient.lastLocation.addOnSuccessListener { location: Location? ->
                        location?.let {
                            val userPoint = GeoPoint(it.latitude, it.longitude)
                            binding.mapView.controller.setCenter(userPoint)
                            
                            if (currentMarker == null) {
                                currentMarker = Marker(binding.mapView).apply {
                                    position = userPoint
                                    setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM)
                                    title = "Moja poloha"
                                }
                                binding.mapView.overlays.add(currentMarker)
                            } else {
                                currentMarker?.position = userPoint
                            }
                            binding.mapView.invalidate()
                            binding.tvStatus.text = "GPS aktívna: ${it.latitude}, ${it.longitude}"
                        } ?: run {
                            binding.tvStatus.text = "GPS: Čakám na signál..."
                        }
                    }
                } catch (e: SecurityException) {
                    binding.tvStatus.text = "GPS: Chýbajú práva"
                }
            }

            private fun loadOrPromptDexcomCredentials() {
                val prefs = getSharedPreferences("DexcomPrefs", Context.MODE_PRIVATE)
                dexcomUser = prefs.getString("username", "") ?: ""
                dexcomPass = prefs.getString("password", "") ?: ""

                if (dexcomUser.isEmpty() || dexcomPass.isEmpty()) {
                    showLoginDialog()
                } else {
                    startDexcomFetchingLoop()
                }
            }

            private fun showLoginDialog() {
                val layout = android.widget.LinearLayout(this).apply {
                    orientation = android.widget.LinearLayout.VERTICAL
                    setPadding(50, 40, 50, 10)
                }

                val inputUser = EditText(this).apply { hint = "Dexcom Email / Username" }
                val inputPass = EditText(this).apply { 
                    hint = "Dexcom Heslo"
                    inputType = android.text.InputType.textInputTypeVariationPassword or android.text.InputType.TYPE_CLASS_TEXT
                }

                layout.addView(inputUser)
                layout.addView(inputPass)

                AlertDialog.Builder(this)
                    .setTitle("Prihlásenie do Dexcom účtu")
                    .setView(layout)
                    .setCancelable(false)
                    .setPositiveButton("Uložiť a pripojiť") { _, _ ->
                        dexcomUser = inputUser.text.toString().trim()
                        dexcomPass = inputPass.text.toString().trim()
                        
                        getSharedPreferences("DexcomPrefs", Context.MODE_PRIVATE).edit()
                            .putString("username", dexcomUser)
                            .putString("password", dexcomPass)
                            .apply()

                        startDexcomFetchingLoop()
                    }
                    .show()
            }

            private fun startDexcomFetchingLoop() {
                coroutineScope.launch(Dispatchers.IO) {
                    while (isActive) {
                        try {
                            val sessionId = authenticateDexcom(dexcomUser, dexcomPass)
                            if (sessionId != null && sessionId != "00000000-0000-0000-0000-000000000000") {
                                val glucoseData = fetchLatestGlucose(sessionId)
                                if (glucoseData != null) {
                                    val valueMgDl = glucoseData.getDouble("Value")
                                    val mmolL = valueMgDl / 18.0
                                    val trend = glucoseData.getInt("Trend")
                                    val trendText = getTrendDescription(trend)

                                    withContext(Dispatchers.Main) {
                                        val formattedValue = String.format("%.1f", mmolL)
                                        binding.tvGlycemia.text = "Glykémia: $formattedValue mmol/L | $trendText"
                                        checkAlarmsAndTrigger(mmolL)
                                    }
                                } else {
                                    withContext(Dispatchers.Main) {
                                        binding.tvGlycemia.text = "Dexcom: Žiadne dáta"
                                    }
                                }
                            } else {
                                withContext(Dispatchers.Main) {
                                    binding.tvGlycemia.text = "Dexcom: Zlé prihlásenie"
                                }
                            }
                        } catch (e: Exception) {
                            withContext(Dispatchers.Main) {
                                binding.tvGlycemia.text = "Dexcom: Chyba siete"
                            }
                        }
                        delay(300 * 1000)
                    }
                }
            }

            private fun authenticateDexcom(user: String, pass: String): String? {
                val url = "$DEXCOM_BASE_URL/General/LoginPublisherAccountByName"
                val json = JSONObject().apply {
                    put("accountName", user)
                    put("password", pass)
                    put("applicationId", DEXCOM_APP_ID)
                }

                val body = json.toString().toRequestBody("application/json; charset=utf-8".toMediaType())
                val request = Request.Builder().url(url).post(body).build()

                client.newCall(request).execute().use { response ->
                    if (!response.isSuccessful) return null
                    return response.body?.string()?.replace("\"", "")
                }
            }

            private fun fetchLatestGlucose(sessionId: String): JSONObject? {
                val url = "$DEXCOM_BASE_URL/Publisher/ReadPublisherLatestGlucoseValues?sessionId=$sessionId&minutes=1440&maxCount=1"
                val request = Request.Builder().url(url).get().build()

                client.newCall(request).execute().use { response ->
                    if (!response.isSuccessful) return null
                    val responseBody = response.body?.string() ?: return null
                    val jsonArray = JSONArray(responseBody)
                    if (jsonArray.length() > 0) {
                        return jsonArray.getJSONObject(0)
                    }
                }
                return null
            }

            private fun getTrendDescription(trend: Int): String {
                return when (trend) {
                    1 -> "Strmo hore ⇈"
                    2 -> "Rýchlo hore ↑"
                    3 -> "Rastie ↗"
                    4 -> "Mierne rastie ↗"
                    5 -> "Stabilná →"
                    6 -> "Mierne klesá ↘"
                    7 -> "Klesá ↘"
                    8 -> "Rýchlo dole ↓"
                    9 -> "Strmo dole ⇊"
                    else -> "Neznámy trend"
                }
            }

            private fun checkAlarmsAndTrigger(value: Double) {
                if (value < 3.9 || value > 10.0) {
                    triggerEmergencyAlert("Pozor! Kritická hodnota: $value mmol/L")
                }
            }

            private fun triggerEmergencyAlert(message: String) {
                Toast.makeText(this, message, Toast.LENGTH_LONG).show()
                try {
                    val vibrator = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                    if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                        vibrator.vibrate(VibrationEffect.createOneShot(1500, VibrationEffect.DEFAULT_HIGH_AMPLITUDE))
                    } else {
                        @Suppress("DEPRECATION")
                        vibrator.vibrate(1500)
                    }
                } catch (e: Exception) {
                    // Ošetrenie
                }
            }

            override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                if (requestCode == PERMISSION_REQUEST_CODE) {
                    fetchLocation()
                }
            }

            override fun onDestroy() {
                super.onDestroy()
                coroutineScope.cancel()
            }

            override fun onResume() {
                super.onResume()
                binding.mapView.onResume()
            }

            override fun onPause() {
                super.onPause()
                binding.mapView.onPause()
            }
        }
        EOF

        cat << 'EOF' > app/src/main/res/values/themes.xml
        <resources>
            <style name="Theme.AppCompat.Light.NoActionBar" parent="Theme.AppCompat.Light.DarkActionBar">
                <item name="windowNoTitle">true</item>
                <item name="windowActionBar">false</item>
            </style>
        </resources>
        EOF

    - name: Run Gradle Build
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
