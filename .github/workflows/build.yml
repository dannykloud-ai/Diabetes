 name: Zostavenie Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Vytvorenie kompletnej Android struktury
        run: |
          mkdir -p app/src/main/java
          find . -maxdepth 1 -name "*.kt" -exec mv {} app/src/main/java/ \; 2>/dev/null || true
          
          echo "include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.1.0' apply false }" > build.gradle
          
          mkdir -p app
          printf "plugins { id 'com.android.application' }\nandroid {\n    namespace 'com.example.cukrovka'\n    compileSdk 34\n    defaultConfig {\n        applicationId \"com.example.cukrovka\"\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName \"1.0\"\n    }\n}\n" > app/build.gradle

          mkdir -p app/src/main
          printf "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <application android:label=\"Cukrovka\">\n        <activity android:name=\".MainActivitz\" android:exported=\"true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n" > app/src/main/AndroidManifest.xml

      - name: Spustenie Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
